name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'sakuralearn-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'sakuralearn-backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sakuralearn-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sakura_user
          POSTGRES_PASSWORD: sakura_password
          POSTGRES_DB: sakuralearn_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B clean package --file pom.xml
