spring:
  ai:
    openai:
      api-key: unit-test-openai-key
    google:
      genai:
        api-key: unit-test-google-genai-key
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false # Disable flyway for fast unit tests, let JPA create schema
  
  # Mock/Disable external services for tests
  kafka:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: unit-test-google-client-id
            client-secret: unit-test-google-client-secret

app:
  jwt:
    secret: unit-test-jwt-secret-with-at-least-thirty-two-characters
  minio:
    access-key: unit-test-minio-access-key
    secret-key: unit-test-minio-secret-key
  ai:
    grok:
      api-key: unit-test-grok-key
