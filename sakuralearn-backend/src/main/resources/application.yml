spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-dummy-key}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:AIzaSyBHA5BZ7SFnLZ5fdmSLnPtitcaXxEWSwf0}
  application:
    name: sakuralearn-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sakuralearn_db?stringtype=unspecified}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # --- NEW: KAFKA CONFIG ---
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: sakuralearn-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # --- NEW: MAILPIT CONFIG ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # --- THYMELEAF CONFIG ---
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:638074642630-0el62id1khlqr1unej069gebptbjerhn.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile

# Custom properties
app:
  auth:
    verify-url: ${APP_VERIFY_URL:http://localhost:8080/api/v1/auth/verify}
    reset-url: ${APP_RESET_URL:http://localhost:3000/reset-password}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  jwt:
    secret: ${JWT_SECRET:dummy-jwt-secret-at-least-32-characters-long}
    expiration: 86400000 # 24 hours
    refreshExpirationMs: 2592000000 # 30 days
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:minio_password}
    bucket-name: ${MINIO_BUCKET:sakuralearn-bucket}
  ai:
    grok:
      api-key: ${GROK_API_KEY:dummy-grok-key}
      base-url: https://api.x.ai/v1

logging:
  level:
    root: INFO
    com.sakuralearn.sakuralearn_backend: INFO
