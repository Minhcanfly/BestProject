spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-dummy-key-for-local-dev}
  application:
    name: sakuralearn-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/sakuralearn_db
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # --- NEW: KAFKA CONFIG ---
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sakuralearn-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # --- NEW: MAILPIT CONFIG ---
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Custom properties
app:
  jwt:
    secret: 9283749823749823749823749823749823479238472938479283749823749823749823749283
    expiration: 86400000 # 24 hours
  minio:
    url: http://localhost:9000
    access-key: admin
    secret-key: minio_password
    bucket-name: sakuralearn-bucket
