spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-dummy-key}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:AIzaSyBHA5BZ7SFnLZ5fdmSLnPtitcaXxEWSwf0}
  application:
    name: sakuralearn-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/sakuralearn_db?stringtype=unspecified
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # --- NEW: KAFKA CONFIG ---
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sakuralearn-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # --- NEW: MAILPIT CONFIG ---
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # --- THYMELEAF CONFIG ---
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 638074642630-0el62id1khlqr1unej069gebptbjerhn.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile

# Custom properties
app:
  auth:
    verify-url: http://localhost:8080/api/v1/auth/verify
    reset-url: http://localhost:3000/reset-password
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/redirect
  jwt:
    secret: ${JWT_SECRET:dummy-jwt-secret-at-least-32-characters-long}
    expiration: 86400000 # 24 hours
    refreshExpirationMs: 2592000000 # 30 days
  minio:
    url: http://localhost:9000
    access-key: admin
    secret-key: minio_password
    bucket-name: sakuralearn-bucket
  ai:
    grok:
      api-key: ${GROK_API_KEY:dummy-grok-key}
      base-url: https://api.x.ai/v1
