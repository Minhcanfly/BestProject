spring:
  application:
    name: sakuralearn-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sakuralearn_db
    username: sakura_user
    password: sakura_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8080

app:
  jwt:
    secret: 928374982364982374982374982374982374982347923847923847923847923847923847 # Example secret for local dev
    expiration: 86400000 # 1 day
    refresh-expiration: 604800000 # 7 days
