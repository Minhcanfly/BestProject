<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Xác thực tài khoản</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .success .icon { color: #2ecc71; }
        .error .icon { color: #e74c3c; }
        h1 { margin-top: 0; color: #2d3436; }
        p { color: #636e72; font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #ee5253;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card" th:classappend="${status}">
        <div class="icon" th:text="${status == 'success' ? '✔' : '✘'}"></div>
        <h1 th:text="${title}">Tiêu đề</h1>
        <p th:text="${message}">Nội dung thông báo.</p>
        <a href="/" class="btn">Quay lại Trang chủ</a>
    </div>
</body>
</html>
